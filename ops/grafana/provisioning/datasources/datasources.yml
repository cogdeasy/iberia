apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: iberia-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    type: loki
    uid: iberia-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
