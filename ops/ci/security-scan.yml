# Security scanning workflow (definition).
#
# Lives under ops/ci/ and is installed to .github/workflows/security-scan.yml by the
# platform session. Every scanner runs in NON-BLOCKING mode: this repository ships
# deliberately planted vulnerabilities (see docs/VULNERABILITIES.md), so the job must
# surface findings as artifacts and a summary, never fail the build.
name: security-scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  backend-scan:
    name: Backend SAST & dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install project and scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install bandit pip-audit

      - name: Bandit (Python SAST)
        continue-on-error: true
        run: |
          mkdir -p ../reports
          bandit -r app -f json -o ../reports/bandit.json || true
          bandit -r app -f txt  -o ../reports/bandit.txt  || true

      - name: pip-audit (dependency vulnerabilities)
        continue-on-error: true
        run: |
          mkdir -p ../reports
          pip-audit -r requirements.txt -f json -o ../reports/pip-audit.json || true
          pip-audit -r requirements.txt -f columns > ../reports/pip-audit.txt || true

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-backend
          path: reports/
          if-no-files-found: warn

  frontend-scan:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit
        continue-on-error: true
        run: |
          mkdir -p ../reports
          npm audit --audit-level=high --json > ../reports/npm-audit.json || true
          npm audit --audit-level=high > ../reports/npm-audit.txt || true

      - name: Upload frontend reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-frontend
          path: reports/
          if-no-files-found: warn

  semgrep:
    name: Semgrep (p/ci ruleset)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        continue-on-error: true
        run: |
          mkdir -p reports
          semgrep --config p/ci --json --output reports/semgrep.json . || true
          semgrep --config p/ci --output reports/semgrep.txt . || true

      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-semgrep
          path: reports/
          if-no-files-found: warn

  findings-register:
    name: Planted-findings index freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check docs/VULNERABILITIES.md is in sync
        continue-on-error: true
        run: python3 scripts/generate_vuln_index.py --check

      - name: Summarise register
        continue-on-error: true
        run: |
          {
            echo '## Planted findings register'
            echo
            sed -n '1,80p' docs/VULNERABILITIES.md
          } >> "$GITHUB_STEP_SUMMARY"
